<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube DJ Deck - Custom Deck Controller & Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0d0e12;
      --card-bg: rgba(18, 18, 22, 0.75);
      --card-border: rgba(0, 242, 254, 0.18);
      --cyan-main: #00f2fe;
      --cyan-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --cyan-glow: rgba(0, 242, 254, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      outline: none !important;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-dark);
      background: radial-gradient(circle at 50% 20%, #161822 0%, #0d0e12 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 1080px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1rem 1.75rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      font-size: 1.8rem;
      color: var(--cyan-main);
      text-shadow: 0 0 15px var(--cyan-glow);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: var(--cyan-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.9rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    .status-dot.playing {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-dot.paused {
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    /* Track Loader Card */
    .loader-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.25rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .loader-row {
      display: flex;
      gap: 0.85rem;
    }

    .url-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .url-input:focus {
      border-color: var(--cyan-main);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .btn {
      background: var(--cyan-gradient);
      color: #000;
      border: none;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px var(--cyan-glow);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 242, 254, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--cyan-main);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .presets-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .preset-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .preset-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-chip:hover {
      background: var(--cyan-main);
      color: #000;
      border-color: var(--cyan-main);
    }

    /* DJ Deck Main Layout */
    .deck-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
    }

    /* Video Deck Frame */
    .video-deck {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(0, 242, 254, 0.2);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    }

    #yt-player {
      width: 100%;
      height: 100%;
      pointer-events: none; /* Hide internal YouTube click interactions */
    }

    .video-overlay-cover {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.2);
      border-radius: 12px;
    }

    /* Track Timeline / Scrub Bar */
    .timeline-box {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan-main);
      font-family: monospace;
    }

    .scrub-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .scrub-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--cyan-main);
      box-shadow: 0 0 10px var(--cyan-main);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .scrub-bar::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    /* DJ Control Panel Sidebar */
    .control-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    /* Transport Controls */
    .transport-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .btn-play {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-play:hover {
      box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
    }

    .btn-pause {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-pause:hover {
      box-shadow: 0 6px 25px rgba(245, 158, 11, 0.6);
    }

    /* Sliders Group */
    .slider-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .slider-val {
      color: var(--cyan-main);
      font-family: monospace;
      font-size: 0.95rem;
    }

    .dj-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .dj-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--cyan-main);
      box-shadow: 0 0 12px var(--cyan-main);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .dj-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .speed-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      margin-top: 0.25rem;
    }

    .speed-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.3rem 0;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .speed-btn:hover, .speed-btn.active {
      background: var(--cyan-main);
      color: #000;
    }

    /* Equalizer Visualizer Bars */
    .eq-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 48px;
      gap: 4px;
    }

    .eq-bar {
      flex: 1;
      background: var(--cyan-gradient);
      border-radius: 3px 3px 0 0;
      height: 15%;
      transition: height 0.15s ease;
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    @media (max-width: 900px) {
      .deck-grid { grid-template-columns: 1fr; }
      .loader-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header Bar -->
    <header>
      <div class="brand">
        <div class="brand-icon">🎧</div>
        <h1>YouTube DJ Deck</h1>
      </div>

      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Deck Idle</span>
      </div>
    </header>

    <!-- Track Loader Card -->
    <div class="loader-card">
      <div class="loader-row">
        <input id="trackInput" type="text" class="url-input" placeholder="Paste YouTube Video URL or Video ID (e.g. https://www.youtube.com/watch?v=dQw4w9WgXcQ)">
        <button id="btnLoadTrack" class="btn">⚡ Load Track</button>
      </div>

      <div class="presets-row">
        <span class="preset-label">Quick Tracks:</span>
        <button class="preset-chip" data-id="jfKfPfyJRdk">Lofi Hip Hop Beats</button>
        <button class="preset-chip" data-id="4xDzrJKXOOY">Synthwave Cyberpunk</button>
        <button class="preset-chip" data-id="dQw4w9WgXcQ">Classic EDM Mix</button>
      </div>
    </div>

    <!-- DJ Deck Main Layout -->
    <div class="deck-grid">
      
      <!-- Video Deck Frame -->
      <div class="video-deck">
        <div class="video-viewport">
          <div id="yt-player"></div>
          <div class="video-overlay-cover"></div>
        </div>

        <!-- Track Timeline / Scrub Bar -->
        <div class="timeline-box">
          <div class="time-display">
            <span id="currTimeText">00:00</span>
            <span id="durTimeText">00:00</span>
          </div>
          <input id="scrubBar" type="range" class="scrub-bar" min="0" max="100" value="0">
        </div>
      </div>

      <!-- DJ Control Panel Sidebar -->
      <div class="control-panel">
        <div>
          <div class="section-title">Transport Controls</div>
          <div class="transport-row">
            <button id="btnPlay" class="btn btn-play">▶ PLAY</button>
            <button id="btnPause" class="btn btn-pause">⏸ PAUSE</button>
          </div>
        </div>

        <div>
          <div class="section-title">Deck Controls</div>
          
          <div style="display: flex; flex-direction: column; gap: 0.85rem;">
            <!-- Master Volume Slider -->
            <div class="slider-card">
              <div class="slider-header">
                <span>🔊 Master Volume</span>
                <span id="volValText" class="slider-val">100%</span>
              </div>
              <input id="volSlider" type="range" class="dj-slider" min="0" max="100" value="100">
            </div>

            <!-- Playback Speed / Pitch Slider -->
            <div class="slider-card">
              <div class="slider-header">
                <span>🎚️ Playback Speed / Pitch</span>
                <span id="speedValText" class="slider-val">1.00x</span>
              </div>
              <input id="speedSlider" type="range" class="dj-slider" min="0.5" max="2.0" step="0.05" value="1.0">
              
              <div class="speed-presets">
                <button class="speed-btn" data-speed="0.75">0.75x</button>
                <button class="speed-btn active" data-speed="1.0">1.00x</button>
                <button class="speed-btn" data-speed="1.25">1.25x</button>
                <button class="speed-btn" data-speed="1.5">1.50x</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Equalizer VU Meter Animation -->
        <div class="eq-box">
          <div class="slider-header" style="margin-bottom:0.2rem;">
            <span style="font-size:0.78rem; color:var(--text-muted); text-transform:uppercase;">Audio Visualizer</span>
          </div>
          <div id="eqBars" class="eq-bars">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- YOUTUBE IFRAME API & DJ DECK ENGINE -->
  <script>
    let player = null;
    let isApiReady = false;
    let isScrubbing = false;
    let updateTimer = null;
    let eqTimer = null;
    let currentVideoId = 'jfKfPfyJRdk'; // Default Lofi Beats

    // Load YouTube IFrame API Script Dynamically
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onYouTubeIframeAPIReady = function() {
      isApiReady = true;
      initPlayer(currentVideoId);
    };

    function extractVideoId(input) {
      if (!input) return null;
      input = input.trim();
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);
      if (match && match[2].length === 11) return match[2];
      if (input.length === 11) return input;
      return null;
    }

    function initPlayer(videoId) {
      currentVideoId = videoId;

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
        return;
      }

      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'rel': 0,
          'showinfo': 0,
          'modestbranding': 1,
          'iv_load_policy': 3,
          'enablejsapi': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      console.log("YouTube Player API Ready.");
      updateStatus('Deck Ready', 'paused');
      setupDeckControls();
      startDeckTimers();
    }

    function onPlayerStateChange(event) {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (event.data === YT.PlayerState.PLAYING) {
        updateStatus('Playing', 'playing');
      } else if (event.data === YT.PlayerState.PAUSED) {
        updateStatus('Paused', 'paused');
      } else if (event.data === YT.PlayerState.BUFFERING) {
        updateStatus('Buffering...', 'paused');
      } else if (event.data === YT.PlayerState.ENDED) {
        updateStatus('Track Ended', 'paused');
      }
    }

    function onPlayerError(event) {
      console.error("YouTube Player Error:", event.data);
      updateStatus('Player Error', 'paused');
    }

    function updateStatus(text, stateClass) {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      if (statusText) statusText.textContent = text;
      if (statusDot) statusDot.className = `status-dot ${stateClass}`;
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function setupDeckControls() {
      // 1. Track Loader & Input
      const btnLoadTrack = document.getElementById('btnLoadTrack');
      const trackInput = document.getElementById('trackInput');

      btnLoadTrack.addEventListener('click', () => {
        const id = extractVideoId(trackInput.value);
        if (id) {
          initPlayer(id);
          trackInput.value = '';
        } else {
          alert("Invalid YouTube URL or Video ID. Please check the link and try again.");
        }
      });

      trackInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') btnLoadTrack.click();
      });

      document.querySelectorAll('.preset-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const id = chip.getAttribute('data-id');
          if (id) initPlayer(id);
        });
      });

      // 2. Transport Controls (Play & Pause)
      document.getElementById('btnPlay').addEventListener('click', () => {
        if (player && typeof player.playVideo === 'function') {
          player.playVideo();
        }
      });

      document.getElementById('btnPause').addEventListener('click', () => {
        if (player && typeof player.pauseVideo === 'function') {
          player.pauseVideo();
        }
      });

      // 3. Master Volume Control
      const volSlider = document.getElementById('volSlider');
      const volValText = document.getElementById('volValText');
      volSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        volValText.textContent = `${val}%`;
        if (player && typeof player.setVolume === 'function') {
          player.setVolume(val);
        }
      });

      // 4. Playback Speed / Pitch Control
      const speedSlider = document.getElementById('speedSlider');
      const speedValText = document.getElementById('speedValText');
      const speedBtns = document.querySelectorAll('.speed-btn');

      const setSpeed = (val) => {
        val = parseFloat(val);
        speedSlider.value = val;
        speedValText.textContent = `${val.toFixed(2)}x`;
        if (player && typeof player.setPlaybackRate === 'function') {
          player.setPlaybackRate(val);
        }
        speedBtns.forEach(btn => {
          btn.classList.toggle('active', parseFloat(btn.getAttribute('data-speed')) === val);
        });
      };

      speedSlider.addEventListener('input', (e) => setSpeed(e.target.value));

      speedBtns.forEach(btn => {
        btn.addEventListener('click', () => setSpeed(btn.getAttribute('data-speed')));
      });

      // 5. Timeline Scrubbing
      const scrubBar = document.getElementById('scrubBar');
      scrubBar.addEventListener('mousedown', () => isScrubbing = true);
      scrubBar.addEventListener('mouseup', () => {
        isScrubbing = false;
        if (player && typeof player.getDuration === 'function') {
          const duration = player.getDuration();
          const targetTime = (scrubBar.value / 100) * duration;
          player.seekTo(targetTime, true);
        }
      });
    }

    function startDeckTimers() {
      // Timeline & Audio Visualizer Timers
      setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function' || isScrubbing) return;
        const currTime = player.getCurrentTime() || 0;
        const duration = player.getDuration() || 0;

        document.getElementById('currTimeText').textContent = formatTime(currTime);
        document.getElementById('durTimeText').textContent = formatTime(duration);

        if (duration > 0) {
          document.getElementById('scrubBar').value = (currTime / duration) * 100;
        }

        // Equalizer Animation
        const isPlaying = (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING);
        const bars = document.querySelectorAll('.eq-bar');
        bars.forEach(bar => {
          if (isPlaying) {
            const h = Math.floor(20 + Math.random() * 80);
            bar.style.height = `${h}%`;
          } else {
            bar.style.height = '10%';
          }
        });
      }, 200);
    }
  </script>
</body>
</html>
