<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube DJ Deck - Dual Deck & Master Crossfader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0d0e12;
      --card-bg: rgba(18, 18, 24, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      
      /* Deck A Theme: Neon Cyan */
      --cyan-main: #00f2fe;
      --cyan-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --cyan-glow: rgba(0, 242, 254, 0.4);
      --deck-a-border: rgba(0, 242, 254, 0.3);

      /* Deck B Theme: Neon Magenta */
      --magenta-main: #ec4899;
      --magenta-gradient: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      --magenta-glow: rgba(236, 72, 153, 0.4);
      --deck-b-border: rgba(236, 72, 153, 0.3);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      outline: none !important;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 50% 20%, #161822 0%, #0d0e12 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 1380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 0.9rem 1.5rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      font-size: 1.6rem;
      color: var(--cyan-main);
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #00f2fe, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .master-status {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .deck-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
    }

    .dot-a { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan-main); box-shadow: 0 0 8px var(--cyan-main); }
    .dot-b { width: 8px; height: 8px; border-radius: 50%; background: var(--magenta-main); box-shadow: 0 0 8px var(--magenta-main); }

    /* Main Decks Grid */
    .decks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    /* Deck Card */
    .deck-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .deck-card.deck-a { border: 1px solid var(--deck-a-border); }
    .deck-card.deck-b { border: 1px solid var(--deck-b-border); }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .deck-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .deck-a .deck-title { color: var(--cyan-main); text-shadow: 0 0 10px var(--cyan-glow); }
    .deck-b .deck-title { color: var(--magenta-main); text-shadow: 0 0 10px var(--magenta-glow); }

    /* Track Input & Presets */
    .loader-box {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    .url-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
    }

    .url-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-load {
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      color: #000;
    }

    .deck-a .btn-load { background: var(--cyan-gradient); box-shadow: 0 4px 15px var(--cyan-glow); }
    .deck-b .btn-load { background: var(--magenta-gradient); color: #fff; box-shadow: 0 4px 15px var(--magenta-glow); }

    .presets-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.25rem 0.6rem;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .deck-a .chip:hover { background: var(--cyan-main); color: #000; }
    .deck-b .chip:hover { background: var(--magenta-main); color: #fff; }

    /* Video Viewport */
    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.08);
      transition: opacity 0.25s ease;
    }

    .yt-player {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Timeline Scrub Bar */
    .timeline-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: monospace;
    }

    .deck-a .time-display { color: var(--cyan-main); }
    .deck-b .time-display { color: var(--magenta-main); }

    .scrub-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
    }

    .deck-a .scrub-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--cyan-main); box-shadow: 0 0 10px var(--cyan-main); }
    .deck-b .scrub-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--magenta-main); box-shadow: 0 0 10px var(--magenta-main); }

    /* Controls Grid inside Deck */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .transport-box {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action {
      flex: 1;
      padding: 0.65rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      color: #fff;
    }

    .btn-play { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-pause { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .slider-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .deck-a .val-text { color: var(--cyan-main); font-family: monospace; }
    .deck-b .val-text { color: var(--magenta-main); font-family: monospace; }

    .dj-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
    }

    .deck-a .dj-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--cyan-main); }
    .deck-b .dj-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--magenta-main); }

    /* Equalizer VU Meter */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 28px;
      gap: 3px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 6px;
    }

    .eq-bar { flex: 1; border-radius: 2px 2px 0 0; height: 15%; transition: height 0.15s ease; }
    .deck-a .eq-bar { background: var(--cyan-gradient); }
    .deck-b .eq-bar { background: var(--magenta-gradient); }

    /* Master Crossfader Center Bar */
    .crossfader-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 1.25rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      align-items: center;
    }

    .crossfader-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .crossfader-slider-wrap {
      width: 100%;
      max-width: 720px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .crossfader-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 14px;
      background: linear-gradient(90deg, var(--cyan-main) 0%, rgba(255,255,255,0.1) 50%, var(--magenta-main) 100%);
      border-radius: 7px;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .crossfader-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 38px;
      border-radius: 6px;
      background: #ffffff;
      border: 2px solid #1e293b;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .crossfader-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .crossfader-actions {
      display: flex;
      gap: 0.6rem;
    }

    .xfade-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.35rem 0.9rem;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .xfade-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    @media (max-width: 1024px) {
      .decks-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header Bar -->
    <header>
      <div class="brand">
        <div class="brand-icon">🎧</div>
        <h1>YouTube DJ Console</h1>
      </div>

      <div class="master-status">
        <div class="deck-badge">
          <div class="dot-a"></div>
          <span id="statusTextA">Deck A: Ready</span>
        </div>
        <div class="deck-badge">
          <div class="dot-b"></div>
          <span id="statusTextB">Deck B: Ready</span>
        </div>
      </div>
    </header>

    <!-- Dual Decks Grid -->
    <div class="decks-grid">
      
      <!-- DECK A (LEFT - CYAN) -->
      <div class="deck-card deck-a">
        <div class="deck-header">

            <button class="chip" data-deck="A" data-id="4xDzrJKXOOY">Synthwave</button>
            <button class="chip" data-deck="A" data-id="dQw4w9WgXcQ">Classic EDM</button>
          </div>
        </div>

        <div id="viewport-a" class="video-viewport">
          <div id="yt-player-a" class="yt-player"></div>

        <div class="controls-grid">
          <div>
            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; margin-bottom:0.3rem;">TRANSPORT</div>

          </div>

          <div class="slider-card">
            <div class="slider-header">
              <span>🔊 Deck Vol</span>
              <span id="volValTextA" class="val-text">100%</span>
            </div>
            <input id="volSliderA" type="range" class="dj-slider" min="0" max="100" value="100">
          </div>
        </div>

        <div class="slider-card">
          <div class="slider-header">
            <span>🎚️ Speed / Pitch</span>
            <span id="speedValTextA" class="val-text">1.00x</span>
          </div>
          <input id="speedSliderA" type="range" class="dj-slider" min="0.5" max="2.0" step="0.05" value="1.0">
        </div>

        <div id="eqBarsA" class="eq-bars">
          <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
          <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
      </div>

      <!-- DECK B (RIGHT - MAGENTA) -->
      <div class="deck-card deck-b">
        <div class="deck-header">
          <div class="deck-title">🎛️ Deck B (Right)</div>
          <span id="trackTitleB" style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Synthwave Cyberpunk</span>
        </div>

        <div class="loader-box">
          <div class="input-group">
            <input id="inputB" type="text" class="url-input" placeholder="YouTube URL or Video ID for Deck B">
            <button id="btnLoadB" class="btn-load">Load B</button>
          </div>
          <div class="presets-row">
            <button class="chip" data-deck="B" data-id="4xDzrJKXOOY">Synthwave</button>
            <button class="chip" data-deck="B" data-id="jfKfPfyJRdk">Lofi Beats</button>
            <button class="chip" data-deck="B" data-id="dQw4w9WgXcQ">Classic EDM</button>
          </div>
        </div>

        <div id="viewport-b" class="video-viewport">
          <div id="yt-player-b" class="yt-player"></div>
        </div>

        <div class="timeline-box">
          <div class="time-display">
            <span id="currTimeB">00:00</span>
            <span id="durTimeB">00:00</span>
          </div>
          <input id="scrubB" type="range" class="scrub-bar" min="0" max="100" value="0">
        </div>

        <div class="controls-grid">
          <div>
            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; margin-bottom:0.3rem;">TRANSPORT</div>
            <div class="transport-box">
              <button id="btnPlayB" class="btn-action btn-play">▶ PLAY</button>
              <button id="btnPauseB" class="btn-action btn-pause">⏸ PAUSE</button>
            </div>
          </div>

          <div class="slider-card">
            <div class="slider-header">
              <span>🔊 Deck Vol</span>
              <span id="volValTextB" class="val-text">100%</span>
            </div>
            <input id="volSliderB" type="range" class="dj-slider" min="0" max="100" value="100">
          </div>
        </div>

        <div class="slider-card">
          <div class="slider-header">
            <span>🎚️ Speed / Pitch</span>
            <span id="speedValTextB" class="val-text">1.00x</span>
          </div>
          <input id="speedSliderB" type="range" class="dj-slider" min="0.5" max="2.0" step="0.05" value="1.0">
        </div>

        <div id="eqBarsB" class="eq-bars">
          <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
          <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
      </div>

    </div>

    <!-- Master Crossfader Card -->
    <div class="crossfader-card">
      <div class="crossfader-header">
        <span style="color:var(--cyan-main);">◄ DECK A (<span id="crossValTextA">50%</span>)</span>
        <span style="color:var(--text-main);">🎚️ MASTER CROSSFADER</span>
        <span style="color:var(--magenta-main);">DECK B (<span id="crossValTextB">50%</span>) ►</span>
      </div>

      <div class="crossfader-slider-wrap">
        <input id="masterCrossfader" type="range" class="crossfader-slider" min="0" max="100" value="50">
      </div>

      <div class="crossfader-actions">
        <button id="btnXfadeA" class="xfade-btn">◄ FULL DECK A (100 / 0)</button>
        <button id="btnXfadeCenter" class="xfade-btn">⚖️ CENTER (50 / 50)</button>
        <button id="btnXfadeB" class="xfade-btn">FULL DECK B (0 / 100) ►</button>
      </div>
    </div>

  </div>

  <!-- YOUTUBE IFRAME DUAL DECK ENGINE -->
  <script>
    let playerA = null;
    let playerB = null;
    let isScrubbingA = false;
    let isScrubbingB = false;

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onYouTubeIframeAPIReady = function() {
      initDeckA('jfKfPfyJRdk');
      initDeckB('4xDzrJKXOOY');
    };

    function extractVideoId(input) {
      if (!input) return null;
      input = input.trim();
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);
      if (match && match[2].length === 11) return match[2];
      if (input.length === 11) return input;
      return null;
    }

    function initDeckA(videoId) {
      if (playerA && typeof playerA.loadVideoById === 'function') {
        playerA.loadVideoById(videoId);
        return;
      }
      playerA = new YT.Player('yt-player-a', {
        height: '100%', width: '100%', videoId: videoId,
        playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0, 'modestbranding': 1, 'enablejsapi': 1 },
        events: {
          'onReady': () => { updateCrossfade(); setupDeckEvents('A'); },
          'onStateChange': (e) => handleStateChange(e, 'A')
        }
      });
    }

    function initDeckB(videoId) {
      if (playerB && typeof playerB.loadVideoById === 'function') {
        playerB.loadVideoById(videoId);
        return;
      }
      playerB = new YT.Player('yt-player-b', {
        height: '100%', width: '100%', videoId: videoId,
        playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0, 'modestbranding': 1, 'enablejsapi': 1 },
        events: {
          'onReady': () => { updateCrossfade(); setupDeckEvents('B'); },
          'onStateChange': (e) => handleStateChange(e, 'B')
        }
      });
    }

    function handleStateChange(event, deck) {
      const statusText = document.getElementById(`statusText${deck}`);
      if (!statusText) return;
      if (event.data === YT.PlayerState.PLAYING) statusText.textContent = `Deck ${deck}: Playing`;
      else if (event.data === YT.PlayerState.PAUSED) statusText.textContent = `Deck ${deck}: Paused`;
      else if (event.data === YT.PlayerState.BUFFERING) statusText.textContent = `Deck ${deck}: Buffering`;
      else if (event.data === YT.PlayerState.ENDED) statusText.textContent = `Deck ${deck}: Ended`;
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateCrossfade() {
      const crossVal = parseInt(document.getElementById('masterCrossfader').value, 10);
      const volA = parseInt(document.getElementById('volSliderA').value, 10);
      const volB = parseInt(document.getElementById('volSliderB').value, 10);

      const factorA = (100 - crossVal) / 100.0;
      const factorB = crossVal / 100.0;

      const effectiveVolA = Math.round(volA * factorA);
      const effectiveVolB = Math.round(volB * factorB);

      if (playerA && typeof playerA.setVolume === 'function') playerA.setVolume(effectiveVolA);
      if (playerB && typeof playerB.setVolume === 'function') playerB.setVolume(effectiveVolB);

      // Video Opacity Crossfading
      const viewportA = document.getElementById('viewport-a');
      const viewportB = document.getElementById('viewport-b');
      if (viewportA) viewportA.style.opacity = Math.max(0.2, factorA);
      if (viewportB) viewportB.style.opacity = Math.max(0.2, factorB);

      document.getElementById('crossValTextA').textContent = `${Math.round(factorA * 100)}%`;
      document.getElementById('crossValTextB').textContent = `${Math.round(factorB * 100)}%`;
    }

    function setupDeckEvents(deck) {
      const btnLoad = document.getElementById(`btnLoad${deck}`);
      const input = document.getElementById(`input${deck}`);
      const btnPlay = document.getElementById(`btnPlay${deck}`);
      const btnPause = document.getElementById(`btnPause${deck}`);
      const volSlider = document.getElementById(`volSlider${deck}`);
      const volValText = document.getElementById(`volValText${deck}`);
      const speedSlider = document.getElementById(`speedSlider${deck}`);
      const speedValText = document.getElementById(`speedValText${deck}`);

      btnLoad.addEventListener('click', () => {
        const id = extractVideoId(input.value);
        if (id) {
          if (deck === 'A') initDeckA(id);
          else initDeckB(id);
          input.value = '';
        } else {
          alert(`Invalid YouTube URL/ID for Deck ${deck}.`);
        }
      });

      input.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnLoad.click(); });

      btnPlay.addEventListener('click', () => {
        const player = deck === 'A' ? playerA : playerB;
        if (player && typeof player.playVideo === 'function') player.playVideo();
      });

      btnPause.addEventListener('click', () => {
        const player = deck === 'A' ? playerA : playerB;
        if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
      });

      volSlider.addEventListener('input', (e) => {
        volValText.textContent = `${e.target.value}%`;
        updateCrossfade();
      });

      speedSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        speedValText.textContent = `${val.toFixed(2)}x`;
        const player = deck === 'A' ? playerA : playerB;
        if (player && typeof player.setPlaybackRate === 'function') player.setPlaybackRate(val);
      });
    }

    // Global Controls Setup
    document.addEventListener('DOMContentLoaded', () => {
      // Master Crossfader
      const xf = document.getElementById('masterCrossfader');
      xf.addEventListener('input', updateCrossfade);

      document.getElementById('btnXfadeA').addEventListener('click', () => { xf.value = 0; updateCrossfade(); });
      document.getElementById('btnXfadeCenter').addEventListener('click', () => { xf.value = 50; updateCrossfade(); });
      document.getElementById('btnXfadeB').addEventListener('click', () => { xf.value = 100; updateCrossfade(); });

      // Preset Chips
      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const deck = chip.getAttribute('data-deck');
          const id = chip.getAttribute('data-id');
          if (deck === 'A') initDeckA(id);
          else if (deck === 'B') initDeckB(id);
        });
      });

      // Scrub Bars
      const setupScrub = (deck) => {
        const scrub = document.getElementById(`scrub${deck}`);
        scrub.addEventListener('mousedown', () => { if (deck === 'A') isScrubbingA = true; else isScrubbingB = true; });
        scrub.addEventListener('mouseup', () => {
          if (deck === 'A') isScrubbingA = false; else isScrubbingB = false;
          const player = deck === 'A' ? playerA : playerB;
          if (player && typeof player.getDuration === 'function') {
            const dur = player.getDuration();
            player.seekTo((scrub.value / 100) * dur, true);
          }
        });
      };
      setupScrub('A');
      setupScrub('B');

      // Global Update Loop (Timers & Equalizer Visualizer)
      setInterval(() => {
        const updateDeckState = (deck, player, isScrubbing) => {
          if (!player || typeof player.getCurrentTime !== 'function' || isScrubbing) return;
          const currTime = player.getCurrentTime() || 0;
          const dur = player.getDuration() || 0;

          document.getElementById(`currTime${deck}`).textContent = formatTime(currTime);
          document.getElementById(`durTime${deck}`).textContent = formatTime(dur);

          if (dur > 0) {
            document.getElementById(`scrub${deck}`).value = (currTime / dur) * 100;
          }

          const isPlaying = (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING);
          const bars = document.querySelectorAll(`#eqBars${deck} .eq-bar`);
          bars.forEach(bar => {
            if (isPlaying) {
              const h = Math.floor(15 + Math.random() * 85);
              bar.style.height = `${h}%`;
            } else {
              bar.style.height = '10%';
            }
          });
        };

        updateDeckState('A', playerA, isScrubbingA);
        updateDeckState('B', playerB, isScrubbingB);
      }, 200);
    });
  </script>
</body>
